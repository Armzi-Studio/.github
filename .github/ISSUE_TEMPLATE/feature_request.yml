name: "💡 Feature Request"
description: "Suggest an idea or new capability for an Armzi-Studio project."
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please share your proposal and why it would be beneficial.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Desired Feature
      description: Describe what you would like to see implemented or changed.
      placeholder: "Provide a detailed description of the proposed feature..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've evaluated.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context or Mockups
      description: Add any other context, diagrams, or mockups about the feature request here.
