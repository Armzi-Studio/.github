name: "🐛 Bug Report"
description: "File an actionable bug report to help us fix the issue."
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible so we can reproduce and address it quickly.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When doing X, Y happens instead of Z..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Versions
      description: Operating System, browser, runtime (Node, Rust, Python, Go), hardware board (if ESP32/IoT), etc.
      placeholder: |
        - OS: [e.g. macOS 15.0 / Ubuntu 24.04 / Windows 11]
        - Version/Commit: [e.g. v1.2.0 or commit abc1234]
        - Node / Rust / Go version: [e.g. Node 22, Rust 1.84]
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Screenshots
      description: Please copy and paste any relevant logs, terminal stack traces, or paste screenshots here.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I have verified that no sensitive credentials or personal data are exposed in logs/screenshots.
          required: true
